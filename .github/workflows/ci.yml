name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: macOS ARM64 regression
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            程序文件/build-constraints.txt
            程序文件/requirements-light-macos-arm64.txt
      - name: Verify version and public release links
        run: python 程序文件/check_release.py
      - name: Install pinned test runtime (no model downloads)
        run: |
          python -m pip install --require-hashes --no-deps -r 程序文件/build-constraints.txt
          python -m pip install --require-hashes --no-deps --no-build-isolation -r 程序文件/requirements-light-macos-arm64.txt
      - name: Run regression suite
        run: python -m unittest discover -s 程序文件/tests -v
      - name: Build and verify native application
        run: |
          bash 程序文件/build_app.sh "$RUNNER_TEMP/录音转写.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/录音转写.app"
          python 程序文件/check_release.py --app "$RUNNER_TEMP/录音转写.app"
