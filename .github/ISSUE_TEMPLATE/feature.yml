name: 功能建议 / Feature request
description: 说说你希望更方便完成的事 / Tell us what you want to do more easily.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 中文或 English 都欢迎。先讲使用场景和结果，不必先设计实现方案。 / Chinese and English are welcome. Start with your task and desired outcome.
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与困难 / Scenario and difficulty
      description: 你现在怎么做，卡在哪一步？ / What do you do today, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望的结果 / Desired outcome
      description: 如果做成了，你会怎样判断它有用？ / How would you know the change is useful?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法 / Alternatives tried
      description: 可选。请勿包含私人录音或业务文稿。 / Optional. Do not include private recordings or business documents.
